services:
    - type: web
      name: gautamzerodhabackend
      runtime: node
      rootDir: backend
      buildCommand: npm install
      startCommand: npm start
      envVars:
          - key: NODE_ENV
            value: production

    - type: static
      name: gautamzerodhafrontend
      rootDir: frontend
      buildCommand: npm install && npm run build
      staticPublishPath: build
      routes:
          - type: rewrite
            source: /*
            destination: /index.html

    - type: static
      name: gautamzerodhadashboard
      rootDir: dashboard
      buildCommand: npm install && npm run build
      staticPublishPath: build
      routes:
          - type: rewrite
            source: /*
            destination: /index.html
