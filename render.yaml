services:
    - type: static
      name: zerodha-frontend
      rootDir: frontend
      buildCommand: npm install && npm run build
      staticPublishPath: build
      routes:
          - type: rewrite
            source: /*
            destination: /index.html

    - type: static
      name: zerodha-dashboard
      rootDir: dashboard
      buildCommand: npm install && npm run build
      staticPublishPath: build
      routes:
          - type: rewrite
            source: /*
            destination: /index.html
